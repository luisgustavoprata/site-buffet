# O GitHub abre um pedido de atualização quando sai versão nova (com correção de segurança)
# de uma biblioteca do site. Os testes do CI rodam no pedido antes de você aceitar.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
