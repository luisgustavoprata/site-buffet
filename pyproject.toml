[project]
name = "site-buffet"
version = "1.0.0"
description = "Site de buffet com portfólio, área do cliente e orçamentos por conversa (FastAPI)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() nos parâmetros é o padrão do FastAPI.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
