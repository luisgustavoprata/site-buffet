<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Verificação de segurança · Brunoise Gastronomia</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
  <style>
    :root { --bg: #faf6f1; --paper: #fffdf9; --ink: #2a1614; --soft: #5c4541; --muted: #8b746d; --accent: #7a1d14; --copper: #b4703e; --line: #ead9cc; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 20% 0%, #f6e7dc, transparent 55%), var(--bg); color: var(--ink); font: 16px/1.55 "DM Sans", system-ui, sans-serif; }
    main { width: min(460px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px 28px; box-shadow: 0 24px 60px -30px rgba(60, 20, 10, .35); text-align: center; display: grid; gap: 18px; }
    img { width: 190px; height: auto; justify-self: center; }
    h1 { font: 500 26px/1.2 "Fraunces", Georgia, serif; }
    p { color: var(--soft); }
    .check { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
    .check:disabled { cursor: default; }
    .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--copper); display: grid; place-items: center; flex: none; }
    .check.is-working .box { border-color: var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    .check.is-done .box { background: #2d6a3a; border-color: #2d6a3a; }
    .check.is-done .box::after { content: ""; width: 8px; height: 14px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
    .bar { height: 6px; border-radius: 99px; background: #f1e6dd; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--copper), var(--accent)); transition: width .2s; }
    small { color: var(--muted); font-size: 13px; }
    .status { min-height: 1.5em; font-weight: 600; color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .check.is-working .box { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/static/marca-clara.png" alt="Brunoise Gastronomia">
    <h1>Verificação de segurança</h1>
    <p>Para proteger o site, acessos por VPN, de fora do Brasil ou com muitos pedidos seguidos passam por uma confirmação rápida.</p>
    <button class="check" id="check" type="button">
      <span class="box" aria-hidden="true"></span>
      <span id="label">Confirmar que sou uma pessoa</span>
    </button>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <small>Leva poucos segundos. Nenhum dado pessoal é coletado.</small>
  </main>
  <script>
    // SHA-256 de uma mensagem curta (até 55 bytes, um bloco): devolve a primeira palavra (32 bits).
    const K = new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
    const W = new Uint32Array(64);
    function firstWord(str) {
      const n = str.length;
      W.fill(0, 0, 16);
      for (let i = 0; i < n; i++) W[i >> 2] |= (str.charCodeAt(i) & 0xff) << (24 - (i % 4) * 8);
      W[n >> 2] |= 0x80 << (24 - (n % 4) * 8);
      W[15] = n * 8;
      for (let i = 16; i < 64; i++) {
        const a = W[i - 15], b = W[i - 2];
        const s0 = ((a >>> 7) | (a << 25)) ^ ((a >>> 18) | (a << 14)) ^ (a >>> 3);
        const s1 = ((b >>> 17) | (b << 15)) ^ ((b >>> 19) | (b << 13)) ^ (b >>> 10);
        W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
      }
      let a = 0x6a09e667, b = 0xbb67ae85, c = 0x3c6ef372, d = 0xa54ff53a, e = 0x510e527f, f = 0x9b05688c, g = 0x1f83d9ab, h = 0x5be0cd19;
      for (let i = 0; i < 64; i++) {
        const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
        const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
        const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
        const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      return (a + 0x6a09e667) >>> 0;
    }
    const button = document.getElementById("check");
    const label = document.getElementById("label");
    const bar = document.getElementById("bar");
    const statusEl = document.getElementById("status");
    const back = (() => {
      const v = new URLSearchParams(location.search).get("volta") || "/";
      return v.startsWith("/") && !v.startsWith("//") ? v : "/";
    })();

    function solve(salt, bits, onProgress) {
      return new Promise((resolve) => {
        const shift = 32 - bits, expected = 2 ** bits;
        let n = 0;
        const step = () => {
          const end = n + 50000;
          for (; n < end; n++) {
            if ((firstWord(salt + ":" + n) >>> shift) === 0) return resolve(String(n));
          }
          onProgress(Math.min(0.95, 1 - Math.exp(-n / expected)));
          setTimeout(step, 0);
        };
        step();
      });
    }

    async function run() {
      button.disabled = true;
      button.className = "check is-working";
      label.textContent = "Verificando…";
      statusEl.textContent = "";
      bar.style.width = "4%";
      try {
        const challenge = await (await fetch("/_seguranca/desafio", { cache: "no-store" })).json();
        const nonce = await solve(challenge.salt, challenge.bits, (p) => { bar.style.width = `${Math.round(p * 100)}%`; });
        const response = await fetch("/_seguranca/verificar", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: challenge.token, nonce }),
        });
        if (!response.ok) throw new Error("recusado");
        bar.style.width = "100%";
        button.className = "check is-done";
        label.textContent = "Verificado";
        statusEl.textContent = "Tudo certo! Abrindo o site…";
        setTimeout(() => location.replace(back), 700);
      } catch {
        bar.style.width = "0";
        button.className = "check";
        button.disabled = false;
        label.textContent = "Confirmar que sou uma pessoa";
        statusEl.textContent = "Não foi possível confirmar. Tente de novo.";
      }
    }
    button.addEventListener("click", run);
  </script>
</body>
</html>
