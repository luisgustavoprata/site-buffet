<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Verificação de segurança · Brunoise Gastronomia</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,600&display=swap">
  <style>
    :root { --bg: #faf6f1; --paper: #fffdf9; --ink: #2a1614; --soft: #5c4541; --muted: #8b746d; --accent: #7a1d14; --copper: #b4703e; --line: #ead9cc; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(circle at 20% 0%, #f6e7dc, transparent 55%), var(--bg); color: var(--ink); font: 16px/1.55 "DM Sans", system-ui, sans-serif; }
    main { width: min(460px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 34px 30px 28px; box-shadow: 0 24px 60px -30px rgba(60, 20, 10, .35); text-align: center; display: grid; gap: 18px; }
    img { width: 190px; height: auto; justify-self: center; }
    h1 { font: 500 26px/1.2 "Fraunces", Georgia, serif; }
    p { color: var(--soft); }
    .check { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: #fff; text-align: left; cursor: pointer; font: inherit; color: inherit; width: 100%; }
    .check:disabled { cursor: default; }
    .box { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--copper); display: grid; place-items: center; flex: none; }
    .check.is-working .box { border-color: var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    .check.is-done .box { background: #2d6a3a; border-color: #2d6a3a; }
    .check.is-done .box::after { content: ""; width: 8px; height: 14px; border: solid #fff; border-width: 0 3px 3px 0; transform: translateY(-2px) rotate(45deg); }
    .bar { height: 6px; border-radius: 99px; background: #f1e6dd; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--copper), var(--accent)); transition: width .2s; }
    small { color: var(--muted); font-size: 13px; }
    .status { min-height: 1.5em; font-weight: 600; color: var(--accent); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .check.is-working .box { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/static/marca-clara.png" alt="Brunoise Gastronomia">
    <h1>Verificação de segurança</h1>
    <p>Para proteger o site, acessos por VPN, de fora do Brasil ou com muitos pedidos seguidos passam por uma confirmação rápida.</p>
    <button class="check" id="check" type="button">
      <span class="box" aria-hidden="true"></span>
      <span id="label">Confirmar que sou uma pessoa</span>
    </button>
    <div class="bar" aria-hidden="true"><span id="bar"></span></div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <small>Leva poucos segundos. Nenhum dado pessoal é coletado.</small>
  </main>
  <script src="/static/seguranca.js"></script>
</body>
</html>
