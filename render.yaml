# Blueprint do Render para o site de verdade (dados permanentes no PostgreSQL).
# Uso: New > Blueprint > este repositório. Na criação, o Render pede OWNER_EMAIL e
# OWNER_PASSWORD: é o login da dona do buffet no painel do site.
databases:
  - name: buffet-db
    plan: free            # o plano gratuito do PostgreSQL expira em 30 dias; depois, "basic"
    databaseName: buffet
    user: buffet

services:
  - type: web
    name: site-buffet
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buffet-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: PASSWORD_ITERATIONS
        value: "100000"   # menor custo para a CPU limitada do plano gratuito
